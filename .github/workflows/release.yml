name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${commit} -X main.date=${date}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="codex-auth-broker_${VERSION}_${goos}_${goarch}"
            [ "$goarch" = arm ] && name="${name}v7"
            bin=codex-auth-broker
            [ "$goos" = windows ] && bin=codex-auth-broker.exe
            stage="dist/${name}"
            mkdir -p "$stage"
            GOOS="$goos" GOARCH="$goarch" GOARM=7 CGO_ENABLED=0 \
              go build -trimpath -ldflags "$ldflags" -o "${stage}/${bin}" .
            cp LICENSE README.md "$stage/"
            if [ "$goos" = windows ]; then
              (cd dist && zip -qr "${name}.zip" "$name")
            else
              tar -C dist -czf "dist/${name}.tar.gz" "$name"
            fi
            rm -rf "$stage"
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes --verify-tag
